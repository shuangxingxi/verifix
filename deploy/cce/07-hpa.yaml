apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verifix-api
  namespace: verifix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: verifix-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
