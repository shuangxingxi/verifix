apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifix-api
  namespace: verifix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verifix-api
  template:
    metadata:
      labels:
        app: verifix-api
    spec:
      containers:
      - name: api
        image: swr.cn-north-4.myhuaweicloud.com/verifix/verifix-api:1.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: verifix-config
        - secretRef:
            name: verifix-secret
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: evidence
          mountPath: /app/.evidence
      volumes:
      - name: evidence
        emptyDir: {}
